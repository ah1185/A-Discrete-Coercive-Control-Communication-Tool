{% extends 'base.html' %}

{% block header %}
    <h1 class="text-center">{% block title %}Login{% endblock %}</h1>
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <form id="login">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input class="form-control" id="email" name="email" value="" required>
                </div>
                <div class="form-group mb-3">
                    <label for="password">Password</label>
                    <input  class="form-control" type="password" id="password" name="password" value="" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            <div id="responseMessage" class="mt-3"></div>
        </div>
    </div>
</div>
{% endblock %}


{% block javascripts_local %}
{{ super() }}
<script type="text/javascript">
    $(document).ready(function() {
        $('#login').on('submit', function(event) {
            event.preventDefault(); // Prevent the default form submission
            //event.preventDefault(); // Prevent the default form submission

            // Get form data
            // const signalType = $('#signalType').val();
            // const action = $('#action').val();
            // const to = $('#to').val();
            // const message = $('#message').val();

            // Create JSON object
            const formData = {
                email: $('#email').val(),
                password: $('#password').val()
            };

            // Send AJAX request
            $.ajax({
                url: '/login', // Flask route to handle the submission
                type: 'POST',
                contentType: 'application/json; charset=utf-8',
                data: JSON.stringify(formData), // Convert data to JSON
                success: function(response) {
                    // Display success message
                    window.location.href = response.redirect;
                    // $('#responseMessage').html(`
                    //     <div class="alert alert-success">${response.message}</div>
                    // `);
                },
                error: function(xhr, status, error) {
                    // Display error message
                    $('#responseMessage').html(`
                        <div class="alert alert-danger">Error: ${xhr.responseJSON.error}</div>
                    `);
                }
            });
        });
    });
</script>
{% endblock %}
