{% extends 'base.html' %}

{% block header %}
    <h1 class="text-center">{% block title %}Register{% endblock %}</h1>
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <form id="register">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input class="form-control" id="email" name="email" value="" required type="email" placeholder="Enter email">
                </div>
                <div class="form-group mb-3">
                    <label for="password">Password</label>
                    <input class="form-control" type="password" id="password" name="password" value="" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>
        <div id="responseMessage" class="mt-3"></div>
    </div>
</div>
{% endblock %}

{% block javascripts_local %}
{{ super() }}
<script type="text/javascript">
    $(document).ready(function() {
        $('#register').on('submit', function(event) {
            event.preventDefault(); // Prevent the default form submission

            // Create JSON object
            const formData = {
                email: $('#email').val(),
                password: $('#password').val()
            };


            $.ajax({
                url: '/register', 
                type: 'POST',
                contentType: 'application/json; charset=utf-8',
                data: JSON.stringify(formData), // Convert data to JSON
                success: function(response) {
                    window.location.href = '/addActions';
                },
                error: function(xhr, status, error) {
                    $('#responseMessage').html(`
                        <div class="alert alert-danger">Error: ${xhr.responseJSON.error}</div>
                    `);
                }
            });
        });
    });
</script>
{% endblock %}
